name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Fake lights on localhost, a fake Govee, a fake Bluetooth app and a fake Spotify: no devices needed.
      - run: python -m unittest discover -s govee -v
